# Unattended pokeflip: prices refresh on a schedule, the digest lands on your
# phone, and the dashboard stays available.
#
#   cp .env.example .env   # fill in your keys
#   docker compose up -d
#   docker compose logs -f
#
# Everything worth keeping lives in the pokeflip-data volume. Back it up with:
#   docker run --rm -v pokeflip-data:/data -v "$PWD":/out alpine \
#     tar czf /out/pokeflip-backup.tgz -C /data .

services:
  pokeflip:
    build: .
    image: pokeflip:latest
    container_name: pokeflip
    restart: unless-stopped
    ports:
      # Bound to localhost by default. To take tap-to-act notifications you
      # need this reachable from your phone - put a reverse proxy with TLS in
      # front rather than exposing this port directly, and set
      # POKEFLIP_SERVER__API_TOKEN first.
      #
      # For the dashboard on a phone on your own wifi, drop the prefix
      # ("8787:8787") and set POKEFLIP_SERVER__PUBLIC_BASE_URL to the *host*
      # machine's address - inside the container `pokeflip pair` can only see
      # the container's own.
      - "127.0.0.1:8787:8787"
    volumes:
      - pokeflip-data:/data
    env_file:
      - .env
    environment:
      POKEFLIP_DATABASE: /data/pokeflip.db
      POKEFLIP_NOTIFY__REPORT_DIR: /data/reports
      POKEFLIP_HOST: 0.0.0.0
      POKEFLIP_PORT: 8787
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8787/api/health', timeout=8).status_code==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pokeflip-data:
