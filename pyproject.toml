[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeflip"
version = "1.0.0"
description = "Price, trend and signal tracker for Pokemon card flippers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    "apscheduler>=3.10",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# A native app window. Without it `pokeflip app` falls back to your browser,
# so this is genuinely optional. pywebview drives the webview the OS already
# has - WebView2 on Windows, WebKit on macOS, GTK or Qt on Linux - and pulls
# the right backend for the platform it is installed on.
desktop = [
    "pywebview>=5.0",
    "pywebview[qt]>=5.0; sys_platform == 'linux'",
]
# `pokeflip pair` draws its URL as a scannable QR when this is present. The
# pairing URL is short enough to type, so this is a convenience, not a need.
qr = ["qrcode>=7.4"]

[project.scripts]
pokeflip = "pokeflip.cli:main"

[project.gui-scripts]
# Launching this on Windows opens no console window behind the app.
pokeflip-app = "pokeflip.cli:main_app"

[tool.setuptools.packages.find]
include = ["pokeflip*"]

[tool.setuptools.package-data]
pokeflip = ["*.sql", "templates/*", "web/*"]
