[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeflip"
version = "1.0.0"
description = "Price, trend and signal tracker for Pokemon card flippers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    "apscheduler>=3.10",
    "jinja2>=3.1",
]

[project.scripts]
pokeflip = "pokeflip.cli:main"

[tool.setuptools.packages.find]
include = ["pokeflip*"]

[tool.setuptools.package-data]
pokeflip = ["*.sql", "templates/*", "web/*"]
